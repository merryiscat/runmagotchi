<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>스테이지 — 손그림 (드래그 던지기)</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Nanum+Pen+Script&display=swap">

<template id="__bundler_thumbnail">
<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <rect width="100" height="100" fill="#EAE3D8"/>
  <!-- character -->
  <ellipse cx="38" cy="58" rx="14" ry="12" fill="#F4DCDA" stroke="#6B2A2A" stroke-width="1.5"/>
  <ellipse cx="38" cy="46" rx="12" ry="11" fill="#F4DCDA" stroke="#6B2A2A" stroke-width="1.5"/>
  <circle cx="34" cy="45" r="1.2" fill="#6B2A2A"/>
  <circle cx="42" cy="45" r="1.2" fill="#6B2A2A"/>
  <!-- food bowl -->
  <path d="M58 68 H74 L72 76 Q66 78 60 76 Z" fill="#FAFAF7" stroke="#1A1A1A" stroke-width="1.5"/>
  <!-- arc -->
  <path d="M50 50 Q60 30 70 60" stroke="#1A1A1A" stroke-width="1" stroke-dasharray="2 2" fill="none"/>
  <!-- hand cursor -->
  <path d="M62 22 C 62 18, 65 16, 67 18 L 67 14 C 67 12, 70 12, 70 14 L 70 22 L 72 22 L 72 14 C 72 12, 75 12, 75 14 L 75 24 C 75 30, 72 34, 68 34 C 64 34, 62 30, 62 22 Z" fill="#FAFAF7" stroke="#1A1A1A" stroke-width="1.2"/>
</svg>
</template>

<style>
  /* ─── 디자인 토큰 ─── */
  :root {
    --paper:        #FAFAF7;
    --paper-warm:   #F5F1E8;
    --surface:      #FFFFFF;
    --clay:         #EAE3D8;
    --clay-soft:    #F0EBE0;
    --line-strong:  #4A463E;
    --line:         #B8B2A6;
    --line-soft:    #D2CEC4;
    --line-faint:   #E8E3D8;
    --ink-strong:   #1A1A1A;
    --ink-default:  #3A3A3A;
    --ink-muted:    #707070;
    --ink-faint:    #A09A8E;
    --cheong:       #2D5F4F;
    --jeok:         #B33A2A;
    --hwang:        #C99A2E;
    --on-hwang:     #1A1A1A;
    --heuk:         #1F2937;
    --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px;
    --s-5:24px; --s-6:32px; --s-7:48px;
    --fs-xs:12px; --fs-sm:14px; --fs-md:16px; --fs-lg:20px;
    --font-sans: -apple-system, BlinkMacSystemFont, "Noto Sans KR", "Apple SD Gothic Neo", "Segoe UI", Roboto, sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body, #root {
    font-family: var(--font-sans);
    color: var(--ink-strong);
    background: var(--paper);
    min-height: 100vh;
  }
  button { font: inherit; }

  /* ─── Frame (대시보드와 동일) ─── */
  .frame {
    border: 1px solid var(--line-strong);
    background: var(--surface);
    display: flex; flex-direction: column;
    min-height: 100vh;
  }
  .gnb {
    display: flex; align-items: center; justify-content: space-between;
    padding: var(--s-3) var(--s-5);
    border-bottom: 1px solid var(--line);
    background: var(--paper);
  }
  .gnb__logo {
    font-weight: 900; font-size: var(--fs-lg); letter-spacing: -0.5px;
  }
  .gnb__nav {
    display: flex; align-items: center; gap: var(--s-4);
    font-size: var(--fs-sm);
  }
  .gnb__nav a { color: var(--ink-strong); text-decoration: none; }
  .gnb__coin {
    font-weight: 700; display: inline-flex; align-items: center; gap: 6px;
  }
  .gnb__div { width: 1px; height: 14px; background: var(--line-soft); }
  .coin {
    display: inline-flex; align-items: center; justify-content: center;
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--hwang); color: var(--on-hwang);
    font-size: 9px; font-weight: 900; font-family: serif; line-height: 1;
  }

  /* ─── 스테이지 ─── */
  .stage {
    flex: 1; position: relative;
    background: var(--paper);
    overflow: hidden;
    cursor: none; /* 손그림 커서로 대체 */
    user-select: none;
  }
  .stage__label {
    position: absolute; top: var(--s-3); left: var(--s-4);
    font-size: 10px; color: var(--ink-faint);
    font-family: var(--font-mono); letter-spacing: 0.18em; text-transform: uppercase;
  }
  .stage__guide {
    position: absolute; left: 50%; bottom: 20px;
    transform: translateX(-50%);
    font-family: "Nanum Pen Script", cursive;
    font-size: 18px; color: var(--ink-muted);
    text-align: center;
    pointer-events: none;
  }

  /* ─── 캐릭터 ─── */
  .char {
    position: absolute;
    pointer-events: none;
    transition: transform 200ms ease-out;
  }
  .char.is-eating { animation: char-eat 600ms ease-in-out; }
  @keyframes char-eat {
    0%, 100% { transform: scale(1); }
    40%      { transform: scale(1.06) translateY(-3px); }
    70%      { transform: scale(0.96); }
  }
  .char__shadow {
    position: absolute; left: 50%; bottom: -6px; transform: translateX(-50%);
    width: 100px; height: 10px; border-radius: 50%;
    background: radial-gradient(ellipse, rgba(0,0,0,0.22), transparent 70%);
  }
  .char__name {
    position: absolute; left: 50%; bottom: -40px;
    font-family: "Nanum Pen Script", cursive; font-size: 22px;
    text-align: center; white-space: nowrap;
  }
  .char__lv {
    position: absolute; left: 50%; top: -22px;
    font-family: "Gaegu", cursive; font-size: 14px;
    color: var(--ink-muted); text-align: center; white-space: nowrap;
  }

  /* ─── 음식 ─── */
  .food {
    position: absolute;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }
  .food__inner {
    background: var(--paper);
    border: 1.5px solid var(--ink-strong);
    padding: 4px;
    box-shadow: 2px 3px 0 rgba(0,0,0,0.15);
  }
  .food.is-dropping  { animation: food-drop 360ms cubic-bezier(0.34, 1.56, 0.64, 1) both; }
  .food.is-eaten     { animation: food-eaten 400ms ease-in forwards; }
  @keyframes food-drop {
    0%   { transform: translate(-50%, -120%) scale(0.6) rotate(-12deg); opacity: 0; }
    60%  { transform: translate(-50%, -42%)  scale(1.1) rotate(4deg); opacity: 1; }
    100% { transform: translate(-50%, -50%)  scale(1)   rotate(0deg); opacity: 1; }
  }
  @keyframes food-eaten {
    from { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    to   { transform: translate(-50%, -90%) scale(0.4); opacity: 0; }
  }

  /* ─── 손글씨 메시지 ─── */
  .scribble {
    position: absolute;
    font-family: "Nanum Pen Script", cursive;
    font-size: 22px; color: var(--ink-strong);
    transform: translate(-50%, 0);
    animation: float-up 1100ms ease-out forwards;
    pointer-events: none;
    z-index: 30;
  }
  .scribble.is-small { font-size: 16px; }
  .scribble.is-warn  { color: var(--jeok); }
  @keyframes float-up {
    from { transform: translate(-50%, 0) rotate(-3deg); opacity: 0; }
    20%  { opacity: 1; }
    to   { transform: translate(-50%, -64px) rotate(-1deg); opacity: 0; }
  }

  /* ─── 손그림 커서 ─── */
  .cursor {
    position: absolute;
    pointer-events: none;
    z-index: 999;
  }
  .cursor__held {
    position: absolute; left: 22px; top: 24px;
    padding: 2px;
    background: var(--paper);
    border: 1.5px solid var(--ink-strong);
    box-shadow: 1px 1px 0 var(--ink-strong);
  }

  /* ─── 가방 패널 ─── */
  .bag {
    position: absolute; right: var(--s-5); top: 50%; transform: translateY(-50%);
    background: var(--paper); border: 1.5px solid var(--ink-strong);
    padding: var(--s-3); display: flex; flex-direction: column; gap: var(--s-2);
    box-shadow: 3px 3px 0 var(--ink-strong);
    font-family: "Gaegu", cursive;
    z-index: 5;
  }
  .bag__title {
    font-family: "Nanum Pen Script", cursive; font-size: 22px;
    text-align: center; padding-bottom: 4px;
    border-bottom: 1.5px dashed var(--ink-strong);
  }
  .bag__hint {
    font-size: 13px; color: var(--ink-muted); text-align: center;
    font-family: "Gaegu", cursive; margin-top: 2px;
  }
  .bag__item {
    display: flex; align-items: center; gap: var(--s-2);
    padding: 4px 8px;
    border: 1.5px dashed transparent;
    cursor: grab;
    font-size: 15px;
    touch-action: none;
    transition: background 120ms, border-color 120ms;
  }
  .bag__item:hover { border-color: var(--ink-strong); background: var(--paper-warm); }
  .bag__item.is-grabbed { border-color: var(--jeok); background: rgba(179,58,42,0.05); }
  .bag__item.is-empty { opacity: 0.35; cursor: not-allowed; pointer-events: none; }
  .bag__item-name { flex: 1; font-weight: 700; }
  .bag__item-count {
    font-weight: 700; color: var(--ink-muted); font-size: 14px;
  }
</style>
</head>

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel">
/* ─── 아이템 정의 ─── */
const ITEMS = [
  { id: 'feed',    name: '먹이',      exp: 10,  color: '#9A7B5C' },
  { id: 'snack',   name: '간식',      exp: 30,  color: '#C99A2E' },
  { id: 'love',    name: '정',        exp: 50,  color: '#B33A2A' },
  { id: 'tonic',   name: '영양제',    exp: 80,  color: '#2D5F4F' },
  { id: 'herb',    name: '한방 보약', exp: 180, color: '#6e4a25' },
  { id: 'lantern', name: '야간 등불', exp: 0,   color: '#1F2937' },
];

/* ─── SVG 아이콘 ─── */
function ItemIcon({ id, color, size = 32, mono }) {
  const c = mono ? '#1A1A1A' : (color || '#1A1A1A');
  const tint = mono ? '#1A1A1A' : (color || '#1A1A1A');
  const props = { width: size, height: size, viewBox: '0 0 64 64', fill: 'none' };
  switch (id) {
    case 'feed': return (
      <svg {...props}>
        <path d="M10 30 H54 L48 50 Q32 56 16 50 Z" stroke={c} strokeWidth="1.8" fill={mono ? 'transparent' : '#f4ecd8'} strokeLinejoin="round" />
        <path d="M20 28 Q32 22 44 28" stroke={c} strokeWidth="1.5" fill={tint} opacity={mono ? 1 : 0.4} />
      </svg>);
    case 'snack': return (
      <svg {...props}>
        <rect x="14" y="22" width="36" height="22" rx="3" stroke={c} strokeWidth="1.8" fill={mono ? 'transparent' : '#fff4d0'} />
        <circle cx="22" cy="36" r="1.5" fill={tint} />
        <circle cx="32" cy="38" r="1.5" fill={tint} />
        <circle cx="42" cy="35" r="1.5" fill={tint} />
      </svg>);
    case 'love': return (
      <svg {...props}>
        <path d="M32 50 C 14 38, 12 22, 22 18 C 28 16, 32 22, 32 24 C 32 22, 36 16, 42 18 C 52 22, 50 38, 32 50 Z"
          stroke={c} strokeWidth="1.8" fill={mono ? 'transparent' : tint} opacity={mono ? 1 : 0.8} />
      </svg>);
    case 'tonic': return (
      <svg {...props}>
        <rect x="24" y="10" width="16" height="6" stroke={c} strokeWidth="1.8" fill={mono ? 'transparent' : tint} />
        <path d="M22 16 H42 V20 L46 28 V48 Q32 56 18 48 V28 L22 20 Z"
          stroke={c} strokeWidth="1.8" fill={mono ? 'transparent' : '#fff'} />
        <rect x="22" y="34" width="20" height="8" fill={tint} opacity={mono ? 0.3 : 0.6} />
      </svg>);
    case 'herb': return (
      <svg {...props}>
        <path d="M14 36 H50 L46 52 Q32 58 18 52 Z" stroke={c} strokeWidth="1.8" fill={mono ? 'transparent' : '#e8d8c0'} />
        <ellipse cx="32" cy="38" rx="14" ry="2.5" fill={tint} opacity={mono ? 0.4 : 0.6} />
        <path d="M22 28 Q20 22 24 18 Q22 14 26 10" stroke={c} strokeWidth="1.5" fill="none" strokeLinecap="round" />
        <path d="M32 28 Q30 22 34 18 Q32 14 36 10" stroke={c} strokeWidth="1.5" fill="none" strokeLinecap="round" />
        <path d="M42 28 Q40 22 44 18 Q42 14 46 10" stroke={c} strokeWidth="1.5" fill="none" strokeLinecap="round" />
      </svg>);
    case 'lantern': return (
      <svg {...props}>
        <ellipse cx="32" cy="36" rx="16" ry="16" stroke={c} strokeWidth="1.8" fill={mono ? 'transparent' : tint} />
        <path d="M22 16 H42 L40 20 H24 Z" stroke={c} strokeWidth="1.5" fill={mono ? 'transparent' : tint} />
      </svg>);
    default: return null;
  }
}

/* ─── 손그림 커서 ─── */
function HandCursor({ mode = 'point' }) {
  return (
    <svg width="36" height="42" viewBox="0 0 36 42" fill="none">
      <path
        d="M8 18 C 7 12, 10 8, 13 10 L 13 4 C 13 1, 17 1, 17 4 L 17 12 L 19 12 L 19 2 C 19 -1, 23 -1, 23 2 L 23 14 L 25 14 L 25 4 C 25 1, 29 1, 29 4 L 29 18 C 29 28, 24 36, 18 36 C 12 36, 8 30, 8 18 Z"
        stroke="#1A1A1A" strokeWidth="1.4" fill="#FAFAF7"
      />
      {mode === 'point' && (
        <path d="M14 8 L14 -2" stroke="#1A1A1A" strokeWidth="1.4" />
      )}
    </svg>
  );
}

/* ─── 캐릭터 일러스트 (placeholder — 실제로는 AI 도트) ─── */
function CharacterArt({ palette = ['#F4DCDA', '#C58A87', '#6B2A2A'], eating, size = 150 }) {
  const [c1, c2, c3] = palette;
  const [breath, setBreath] = React.useState(false);
  React.useEffect(() => {
    const id = setInterval(() => setBreath(b => !b), 1400);
    return () => clearInterval(id);
  }, []);
  return (
    <div style={{
      width: size, height: size,
      transform: breath ? 'translateY(-2px)' : 'translateY(0)',
      transition: 'transform 1.4s ease-in-out',
    }}>
      <svg viewBox="0 0 120 120" width={size} height={size}>
        <ellipse cx="60" cy="78" rx="38" ry="34" fill={c1} stroke={c3} strokeWidth="1.5" />
        <ellipse cx="60" cy="86" rx="20" ry="16" fill={c2} opacity="0.85" />
        <ellipse cx="60" cy="50" rx="34" ry={eating ? 28 : 30} fill={c1} stroke={c3} strokeWidth="1.5" />
        {eating ? (
          <>
            <path d="M46 50 Q50 46 54 50" stroke={c3} strokeWidth="2" fill="none" strokeLinecap="round" />
            <path d="M66 50 Q70 46 74 50" stroke={c3} strokeWidth="2" fill="none" strokeLinecap="round" />
          </>
        ) : (
          <>
            <circle cx="50" cy="48" r="3" fill={c3} />
            <circle cx="70" cy="48" r="3" fill={c3} />
          </>
        )}
        {eating
          ? <ellipse cx="60" cy="60" rx="6" ry="4" fill={c3} />
          : <path d="M55 60 Q60 63 65 60" stroke={c3} strokeWidth="2" fill="none" strokeLinecap="round" />}
        <ellipse cx="48" cy="108" rx="8" ry="4" fill={c3} />
        <ellipse cx="72" cy="108" rx="8" ry="4" fill={c3} />
      </svg>
    </div>
  );
}

/* ─── 메인 ─── */
const WALK_SPEED = 180; // px/sec
const MIN_WALK_MS = 350;

function StageEHand() {
  // 인벤토리 — 실제 product 에서는 supabase에서 받아옴
  const [inv, setInv] = React.useState({
    feed: 5, snack: 3, tonic: 1, love: 2, herb: 0, lantern: 1,
  });
  const [coin] = React.useState(240);

  // 드래그 중인 아이템 (가방에서 집어든 상태)
  const [drag, setDrag] = React.useState(null); // { id }
  const [cursor, setCursor] = React.useState({ x: -100, y: -100, in: false });

  // 떨어진 음식들 (큐)
  const [foods, setFoods] = React.useState([]);

  // 캐릭터 — 위치 + 좌우 반전 + 이동 시간
  const [char, setChar] = React.useState({ x: 320, y: 280, facing: 1, eating: false });
  const [walkMs, setWalkMs] = React.useState(0);

  const [msgs, setMsgs] = React.useState([]);
  const stageRef = React.useRef(null);

  function pushMsg(text, x, y, opts = {}) {
    const id = Math.random().toString(36).slice(2);
    setMsgs(prev => [...prev, { id, text, x, y, ...opts }]);
    setTimeout(() => setMsgs(prev => prev.filter(m => m.id !== id)), 1100);
  }

  /* ─── 드래그 시작 (가방에서) ─── */
  function pickup(id, e) {
    if (!inv[id]) return;
    e.preventDefault();
    e.stopPropagation();
    setDrag({ id });
    // pointer capture 로 stage 밖으로 잠깐 나가도 따라옴
    e.target.setPointerCapture?.(e.pointerId);
  }

  /* ─── 마우스/터치 이동 ─── */
  function onMove(e) {
    const r = stageRef.current.getBoundingClientRect();
    const x = e.clientX - r.left;
    const y = e.clientY - r.top;
    const inside = x >= 0 && x <= r.width && y >= 0 && y <= r.height;
    setCursor({ x, y, in: inside });
  }
  function onLeave() {
    if (!drag) setCursor(c => ({ ...c, in: false }));
  }
  function onEnter() {
    setCursor(c => ({ ...c, in: true }));
  }

  /* ─── 드래그 끝 → 음식 떨어뜨림 or 취소 ─── */
  function onUp(e) {
    if (!drag) return;
    const r = stageRef.current.getBoundingClientRect();
    const x = e.clientX - r.left;
    const y = e.clientY - r.top;
    const inside = x >= 0 && x <= r.width && y >= 0 && y <= r.height;

    if (inside && (inv[drag.id] || 0) > 0) {
      setInv(prev => ({ ...prev, [drag.id]: prev[drag.id] - 1 }));
      const uid = Math.random().toString(36).slice(2);
      setFoods(prev => [...prev, { uid, id: drag.id, x, y, status: 'dropping' }]);
      pushMsg('툭', x + 10, y - 30, { small: true });
      // dropping → waiting (애니메이션 끝나면)
      setTimeout(() => {
        setFoods(prev => prev.map(f => f.uid === uid ? { ...f, status: 'waiting' } : f));
      }, 380);
    }
    setDrag(null);
  }

  /* ─── 큐 처리 — waiting 음식을 향해 캐릭터가 걸어감 ─── */
  React.useEffect(() => {
    if (char.eating || walkMs > 0) return;
    const next = foods.find(f => f.status === 'waiting');
    if (!next) return;

    const dx = next.x - char.x;
    const dy = next.y - char.y;
    const offsetX = dx >= 0 ? -34 : 34;
    const targetX = next.x + offsetX;
    const targetY = next.y;

    const facing = dx >= 0 ? 1 : -1;
    const realDist = Math.hypot(targetX - char.x, targetY - char.y);
    const dur = Math.max(MIN_WALK_MS, (realDist / WALK_SPEED) * 1000);

    setWalkMs(dur);
    setChar(c => ({ ...c, x: targetX, y: targetY, facing }));

    const item = ITEMS.find(i => i.id === next.id);
    const arriveT = setTimeout(() => {
      setWalkMs(0);
      setChar(c => ({ ...c, eating: true }));
      pushMsg(`냠! +${item.exp}`, next.x, next.y - 40);
      setFoods(prev => prev.map(f => f.uid === next.uid ? { ...f, status: 'eaten' } : f));
      setTimeout(() => {
        setFoods(prev => prev.filter(f => f.uid !== next.uid));
        setChar(c => ({ ...c, eating: false }));
      }, 600);
    }, dur);

    return () => clearTimeout(arriveT);
  }, [foods, char.eating, walkMs]);

  return (
    <div className="frame">
      {/* GNB */}
      <div className="gnb">
        <a className="gnb__logo" href="/dashboard"
           style={{ textDecoration: 'none', color: 'var(--ink-strong)' }}>Runmagotchi</a>
        <nav className="gnb__nav">
          <span className="gnb__coin"><span className="coin">₩</span> {coin.toLocaleString()}</span>
          <span className="gnb__div" />
          <a href="/shop">상점</a>
          <a href="/profile">프로필</a>
          <a href="/auth/signout" style={{ color: 'var(--ink-faint)' }}>로그아웃</a>
        </nav>
      </div>

      {/* 스테이지 */}
      <div
        ref={stageRef}
        className="stage"
        onPointerMove={onMove}
        onPointerUp={onUp}
        onPointerEnter={onEnter}
        onPointerLeave={onLeave}
      >
        <div className="stage__label">STAGE</div>

        {/* 캐릭터 */}
        <div
          className={`char ${char.eating ? 'is-eating' : ''}`}
          style={{
            left: char.x, top: char.y,
            transform: `translate(-50%, -50%) scaleX(${char.facing})`,
            transition: walkMs > 0
              ? `left ${walkMs}ms linear, top ${walkMs}ms linear`
              : 'transform 200ms ease-out',
          }}
        >
          <CharacterArt eating={char.eating} />
          <div className="char__shadow" />
          <div
            className="char__name"
            style={{ transform: `translateX(-50%) scaleX(${char.facing})` }}
          >달이</div>
          <div
            className="char__lv"
            style={{ transform: `translateX(-50%) scaleX(${char.facing})` }}
          >LV.07 · 유아</div>
        </div>

        {/* 음식 */}
        {foods.map(food => {
          const item = ITEMS.find(i => i.id === food.id);
          return (
            <div
              key={food.uid}
              className={`food ${food.status === 'dropping' ? 'is-dropping' : ''} ${food.status === 'eaten' ? 'is-eaten' : ''}`}
              style={{ left: food.x, top: food.y }}
            >
              <div className="food__inner">
                <ItemIcon id={item.id} color={item.color} size={32} />
              </div>
            </div>
          );
        })}

        {/* 손글씨 메시지 */}
        {msgs.map(m => (
          <div
            key={m.id}
            className={`scribble ${m.small ? 'is-small' : ''} ${m.warn ? 'is-warn' : ''}`}
            style={{ left: m.x, top: m.y }}
          >
            {m.text}
          </div>
        ))}

        {/* 안내 */}
        {!drag && foods.length === 0 && !char.eating && (
          <div className="stage__guide">
            가방에서 끌어다<br/>아무 데나 떨어뜨려요
          </div>
        )}

        {/* 가방 패널 */}
        <div className="bag">
          <div className="bag__title">가방 속</div>
          {ITEMS.map(item => {
            const count = inv[item.id] || 0;
            const empty = count === 0;
            return (
              <div
                key={item.id}
                className={`bag__item ${drag?.id === item.id ? 'is-grabbed' : ''} ${empty ? 'is-empty' : ''}`}
                onPointerDown={e => pickup(item.id, e)}
              >
                <ItemIcon id={item.id} mono size={24} />
                <span className="bag__item-name">{item.name}</span>
                <span className="bag__item-count">{count}개</span>
              </div>
            );
          })}
          <div className="bag__hint">끌어다 던져요</div>
        </div>

        {/* 손그림 커서 */}
        {cursor.in && (
          <div
            className="cursor"
            style={{ transform: `translate(${cursor.x - 4}px, ${cursor.y - 2}px)` }}
          >
            <HandCursor mode={drag ? 'grab' : 'point'} />
            {drag && (
              <div className="cursor__held">
                <ItemIcon id={drag.id} color={ITEMS.find(i => i.id === drag.id).color} size={20} />
              </div>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<StageEHand />);
</script>
</body>
</html>
