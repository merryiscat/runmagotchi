<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>상점 — 달리네 만물상</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Nanum+Pen+Script&family=Nanum+Myeongjo:wght@400;700;800&display=swap">

<template id="__bundler_thumbnail">
<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <rect width="100" height="100" fill="#F5F1E8"/>
  <rect x="22" y="18" width="56" height="64" fill="#FAFAF7" stroke="#1A1A1A" stroke-width="2"/>
  <line x1="32" y1="18" x2="32" y2="82" stroke="#B33A2A" stroke-width="1"/>
  <line x1="22" y1="32" x2="78" y2="32" stroke="#1A1A1A" stroke-width="1"/>
  <line x1="36" y1="42" x2="74" y2="42" stroke="#1F2937" stroke-width="0.5" opacity="0.3"/>
  <line x1="36" y1="50" x2="74" y2="50" stroke="#1F2937" stroke-width="0.5" opacity="0.3"/>
  <line x1="36" y1="58" x2="74" y2="58" stroke="#1F2937" stroke-width="0.5" opacity="0.3"/>
  <line x1="36" y1="66" x2="74" y2="66" stroke="#1F2937" stroke-width="0.5" opacity="0.3"/>
  <circle cx="64" cy="72" r="8" fill="none" stroke="#B33A2A" stroke-width="1.5" transform="rotate(-12 64 72)"/>
</svg>
</template>

<style>
  /* ─── Runmagotchi design tokens (subset used by 장부) ─── */
  :root {
    --paper:        #FAFAF7;
    --paper-warm:   #F5F1E8;
    --surface:      #FFFFFF;
    --clay:         #EAE3D8;
    --clay-soft:    #F0EBE0;
    --line-strong:  #4A463E;
    --line:         #B8B2A6;
    --line-soft:    #D2CEC4;
    --line-faint:   #E8E3D8;
    --ink-strong:   #1A1A1A;
    --ink-default:  #3A3A3A;
    --ink-muted:    #707070;
    --ink-faint:    #A09A8E;
    --jeok:         #B33A2A;
    --hwang:        #C99A2E;
    --on-hwang:     #1A1A1A;
    --heuk:         #1F2937;
    --s-1: 4px;  --s-2: 8px;  --s-3: 12px; --s-4: 16px;
    --s-5: 24px; --s-6: 32px; --s-7: 48px;
    --fs-xs:12px; --fs-sm:14px; --fs-md:16px; --fs-lg:20px; --fs-xl:24px; --fs-2xl:32px;
    --font-sans: -apple-system, BlinkMacSystemFont, "Noto Sans KR", "Apple SD Gothic Neo", "Segoe UI", Roboto, sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body, #root {
    font-family: var(--font-sans);
    color: var(--ink-strong);
    background: var(--paper-warm);
    min-height: 100vh;
  }
  button { font: inherit; }

  /* ─── Frame ─── */
  .e-frame {
    border: 1px solid var(--line-strong);
    background: var(--surface);
    display: flex; flex-direction: column;
    min-height: 100vh;
  }

  /* ─── GNB (대시보드와 동일) ─── */
  .gnb {
    display: flex; align-items: center; justify-content: space-between;
    padding: var(--s-3) var(--s-5);
    border-bottom: 1px solid var(--line);
    background: var(--paper-warm);
  }
  .gnb__logo {
    font-weight: 900; font-size: var(--fs-lg); letter-spacing: -0.5px;
  }
  .gnb__nav {
    display: flex; align-items: center; gap: var(--s-4);
    font-size: var(--fs-sm);
  }
  .gnb__nav a {
    color: var(--ink-strong); text-decoration: none;
  }
  .gnb__nav a.is-active { font-weight: 700; }
  .gnb__coin {
    font-weight: 700; display: inline-flex; align-items: center; gap: 6px;
  }
  .gnb__div { width: 1px; height: 14px; background: var(--line-soft); }

  .coin {
    display: inline-flex; align-items: center; justify-content: center;
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--hwang); color: var(--on-hwang);
    font-size: 9px; font-weight: 900; font-family: serif; line-height: 1;
  }

  /* ─── 장부 본문 ─── */
  .e-wrap {
    flex: 1; overflow: auto; padding: var(--s-5) var(--s-4) var(--s-6);
    background: var(--paper-warm);
    background-image:
      radial-gradient(ellipse at 15% 20%, rgba(184, 178, 166, 0.18) 0, transparent 35%),
      radial-gradient(ellipse at 85% 85%, rgba(184, 178, 166, 0.15) 0, transparent 35%);
  }
  .e-book {
    max-width: 580px; margin: 0 auto;
    background: var(--paper);
    background-image:
      /* 흑(heuk) 잉크의 흐릿한 가로 괘선 */
      repeating-linear-gradient(180deg, transparent 0 34px, rgba(31, 41, 55, 0.10) 34px 35px),
      /* 적(jeok) 마진 세로선 */
      linear-gradient(90deg, transparent 0 56px, rgba(179, 58, 42, 0.35) 56px 57px, transparent 57px);
    border: 1px solid var(--line);
    box-shadow:
      0 1px 0 var(--surface) inset,
      0 12px 28px rgba(26, 26, 26, 0.12),
      2px 2px 0 var(--line-soft);
    padding: 30px 36px 60px 76px;
    position: relative;
    font-family: "Gaegu", "Nanum Pen Script", cursive;
    color: var(--ink-strong);
  }
  /* 상단 양쪽 테이프 */
  .e-book::before, .e-book::after {
    content: ""; position: absolute; top: -8px;
    width: 50px; height: 22px;
    background: rgba(234, 227, 216, 0.85);
    border: 1px dashed var(--line-faint);
    transform: rotate(-3deg);
  }
  .e-book::before { left: 20px; }
  .e-book::after  { right: 20px; transform: rotate(2deg); }

  /* 헤더 */
  .e-head {
    display: flex; justify-content: space-between; align-items: flex-end;
    border-bottom: 2px solid var(--ink-strong);
    padding-bottom: 10px; margin-bottom: var(--s-4);
  }
  .e-head__title {
    font-family: "Nanum Pen Script", cursive;
    font-size: 38px; font-weight: 400; line-height: 1;
    color: var(--ink-strong);
  }
  .e-head__sub {
    font-family: "Gaegu", cursive;
    font-size: 15px; color: var(--ink-muted); margin-top: 2px;
  }
  .e-head__date {
    font-family: "Gaegu", cursive;
    font-size: 16px; color: var(--ink-muted);
  }

  /* 표 행 */
  .e-row {
    display: grid;
    grid-template-columns: 26px 1fr 80px 90px 84px;
    align-items: center;
    padding: 4px 0;
    font-size: 18px;
    gap: 8px;
    line-height: 34px;
  }
  .e-row--head {
    border-bottom: 1.5px solid var(--ink-strong);
    font-size: 15px; color: var(--ink-muted); line-height: 28px;
  }
  .e-row__num {
    font-family: "Gaegu", cursive;
    color: var(--ink-muted); font-weight: 700;
  }
  .e-row__name {
    font-family: "Gaegu", cursive; font-weight: 700;
    color: var(--ink-strong);
  }
  .e-row__doodle {
    display: inline-block; vertical-align: middle; margin-right: 8px;
  }
  .e-row__desc {
    font-size: 14px; color: var(--ink-muted); margin-left: 8px;
  }
  .e-row__qty {
    color: var(--ink-muted); font-family: "Gaegu", cursive;
    text-align: center;
  }
  .e-row__cost {
    font-family: "Gaegu", cursive; font-weight: 700;
    text-align: right; padding-right: 8px;
    color: var(--ink-strong);
  }
  .e-row__cost::after {
    content: " ⓦ"; font-size: 14px; color: var(--ink-muted);
  }
  .e-row__cost.is-plain::after { content: ""; }
  .e-row__buy {
    font-family: "Gaegu", cursive; font-size: 16px; font-weight: 700;
    padding: 4px 0; background: transparent;
    border: 2px solid var(--ink-strong);
    color: var(--ink-strong);
    cursor: pointer; transition: background 120ms;
  }
  .e-row__buy:hover { background: var(--clay-soft); }
  .e-row__buy.is-stamped {
    border-color: var(--jeok); color: var(--jeok);
    transform: rotate(-2deg);
  }
  .e-row__buy:disabled {
    border-color: var(--line); color: var(--ink-faint);
    cursor: not-allowed;
  }
  .e-row__buy.is-head {
    border: none; font-size: 14px;
    color: var(--ink-muted); font-weight: 700;
  }

  /* 합계 */
  .e-totals {
    margin-top: var(--s-5); padding-top: var(--s-3);
    border-top: 1px dashed var(--ink-muted);
    display: flex; justify-content: flex-end; gap: var(--s-5);
    font-size: 20px;
  }
  .e-totals__row {
    display: flex; gap: 12px;
    font-family: "Gaegu", cursive; font-weight: 700;
  }
  .e-totals__label { color: var(--ink-muted); }

  /* 도장 */
  .e-stamp {
    position: absolute; bottom: 30px; right: 36px;
    width: 92px; height: 92px;
    border: 3px solid var(--jeok); border-radius: 50%;
    color: var(--jeok);
    font-family: "Nanum Myeongjo", serif; font-weight: 800;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 12px; line-height: 1.2; letter-spacing: 0.1em;
    transform: rotate(-12deg);
    opacity: 0.88;
    background: rgba(255,255,255,0.4);
    pointer-events: none;
  }
  .e-stamp__big { font-size: 24px; }

  /* 잉크 자국 */
  .e-blot {
    position: absolute; border-radius: 50%;
    background: radial-gradient(circle, rgba(31, 41, 55, 0.55) 0, rgba(31, 41, 55, 0.12) 70%, transparent 100%);
  }

  /* 마진 메모 (세로 한자) */
  .e-margin-memo {
    position: absolute; left: 14px; top: 60px;
    font-family: "Nanum Pen Script", cursive;
    font-size: 12px; color: var(--jeok);
    writing-mode: vertical-rl; letter-spacing: 0.3em;
  }

  /* 피드백 메시지 */
  .e-msg {
    text-align: center; margin-top: var(--s-4);
    font-family: "Gaegu", cursive; font-size: 18px;
    color: var(--ink-strong);
  }
  .e-msg.is-warn { color: var(--jeok); }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel">
/* ─── 아이템 카탈로그 (실제로는 백엔드에서) ─── */
const ITEMS = [
  { id: 'feed',    name: '먹이',      desc: '기본 먹이 한 그릇',           cost: 10,  exp: 10  },
  { id: 'snack',   name: '간식',      desc: '달콤한 한입거리',              cost: 25,  exp: 30  },
  { id: 'love',    name: '정',        desc: '친밀도 +1',                    cost: 40,  exp: 50  },
  { id: 'tonic',   name: '영양제',    desc: '성장을 돕는 보양 한 첩',       cost: 60,  exp: 80  },
  { id: 'herb',    name: '한방 보약', desc: '기력을 한 번에 회복',           cost: 120, exp: 180 },
  { id: 'lantern', name: '야간 등불', desc: '24h 야간런 +20%',              cost: 200, exp: 0   },
];

/* ─── 펜으로 휘갈긴 작은 아이콘 ─── */
function MiniDoodle({ id }) {
  const c = 'var(--ink-strong)';
  const props = { width: 26, height: 26, viewBox: '0 0 32 32', fill: 'none' };
  switch (id) {
    case 'feed': return (
      <svg {...props}>
        <path d="M5 16 H27 L24 24 Q16 27 8 24 Z" stroke={c} strokeWidth="2" strokeLinejoin="round" />
        <path d="M9 13 Q16 9 23 13" stroke={c} strokeWidth="1.5" strokeLinecap="round" fill="none" />
      </svg>);
    case 'snack': return (
      <svg {...props}>
        <rect x="7" y="11" width="18" height="12" rx="2" stroke={c} strokeWidth="2" />
        <circle cx="12" cy="17" r="1" fill={c} />
        <circle cx="17" cy="18" r="1" fill={c} />
        <circle cx="22" cy="16" r="1" fill={c} />
      </svg>);
    case 'love': return (
      <svg {...props}>
        <path d="M16 25 C 7 19, 6 11, 11 9 C 14 8, 16 11, 16 12 C 16 11, 18 8, 21 9 C 26 11, 25 19, 16 25 Z"
          stroke={c} strokeWidth="2" fill="none" />
      </svg>);
    case 'tonic': return (
      <svg {...props}>
        <rect x="12" y="5" width="8" height="3" stroke={c} strokeWidth="2" />
        <path d="M11 8 H21 V11 L23 14 V25 Q16 28 9 25 V14 L11 11 Z" stroke={c} strokeWidth="2" />
      </svg>);
    case 'herb': return (
      <svg {...props}>
        <path d="M7 18 H25 L23 26 Q16 29 9 26 Z" stroke={c} strokeWidth="2" />
        <path d="M11 14 Q10 10 13 7 M16 14 Q15 10 18 7 M21 14 Q20 10 23 7"
          stroke={c} strokeWidth="1.5" strokeLinecap="round" fill="none" />
      </svg>);
    case 'lantern': return (
      <svg {...props}>
        <path d="M16 4 V8 M12 8 H20 M11 8 H21 L20 10 H12 Z" stroke={c} strokeWidth="2" fill="none" />
        <ellipse cx="16" cy="18" rx="8" ry="8" stroke={c} strokeWidth="2" />
        <path d="M12 26 H20 L19 28 H13 Z" stroke={c} strokeWidth="2" />
      </svg>);
    default: return null;
  }
}

function ShopELedger() {
  /* 데모용 코인 — 실제 페이지에서는 props 또는 supabase로 받음 */
  const [coin, setCoin] = React.useState(240);
  const [bought, setBought] = React.useState({});
  const [msg, setMsg] = React.useState(null);

  function buy(item) {
    if (coin < item.cost) {
      setMsg({ text: '쥔장: 돈이 모자라네…', warn: true });
      setTimeout(() => setMsg(null), 1600);
      return;
    }
    setCoin(c => c - item.cost);
    setBought(prev => ({ ...prev, [item.id]: (prev[item.id] || 0) + 1 }));
    setMsg({ text: `${item.name} 한 줄 적어드렸수`, warn: false });
    setTimeout(() => setMsg(null), 1600);
  }

  const totalSpent = Object.entries(bought).reduce((sum, [id, n]) => {
    const it = ITEMS.find(x => x.id === id);
    return sum + (it ? it.cost * n : 0);
  }, 0);
  const totalItems = Object.values(bought).reduce((a, b) => a + b, 0);

  /* 오늘 날짜 — 손으로 적은 듯한 표기 */
  const today = new Date();
  const months = ['一','二','三','四','五','六','七','八','九','十','十一','十二'];
  const dateLabel = `丙寅 ${months[today.getMonth()]}月 ${today.getDate()}日`;

  return (
    <div className="e-frame">
      {/* GNB — 대시보드와 동일한 구조 */}
      <div className="gnb">
        <a className="gnb__logo" href="/dashboard"
           style={{ textDecoration: 'none', color: 'var(--ink-strong)' }}>Runmagotchi</a>
        <nav className="gnb__nav">
          <span className="gnb__coin"><span className="coin">₩</span> {coin.toLocaleString()}</span>
          <span className="gnb__div" />
          <a href="/shop" className="is-active">상점</a>
          <a href="/profile">프로필</a>
          <a href="/auth/signout" style={{ color: 'var(--ink-faint)' }}>로그아웃</a>
        </nav>
      </div>

      {/* 본문 */}
      <div className="e-wrap">
        <div className="e-book">
          {/* 헤더 */}
          <div className="e-head">
            <div>
              <div className="e-head__title">달리네 만물상</div>
              <div className="e-head__sub">ㅡ 외상 사절 ㅡ</div>
            </div>
            <div className="e-head__date">{dateLabel}</div>
          </div>

          {/* 표 머리줄 */}
          <div className="e-row e-row--head">
            <div className="e-row__num">#</div>
            <div className="e-row__name">품목</div>
            <div className="e-row__qty">경험</div>
            <div className="e-row__cost is-plain">값</div>
            <div className="e-row__buy is-head">장부</div>
          </div>

          {/* 아이템 줄 */}
          {ITEMS.map((item, idx) => {
            const cnt = bought[item.id] || 0;
            const tooPoor = coin < item.cost;
            return (
              <div key={item.id} className="e-row">
                <div className="e-row__num">{idx + 1}.</div>
                <div className="e-row__name">
                  <span className="e-row__doodle"><MiniDoodle id={item.id} /></span>
                  {item.name}
                  <span className="e-row__desc">— {item.desc}</span>
                </div>
                <div className="e-row__qty">{item.exp ? `+${item.exp}` : '─'}</div>
                <div className="e-row__cost">{item.cost}</div>
                <button
                  className={`e-row__buy ${cnt > 0 ? 'is-stamped' : ''}`}
                  onClick={() => buy(item)}
                  disabled={tooPoor}
                >
                  {cnt > 0 ? `확인 ${cnt}` : '주세요'}
                </button>
              </div>
            );
          })}

          {/* 합계 */}
          <div className="e-totals">
            <div className="e-totals__row">
              <span className="e-totals__label">샀음</span>
              <span>{totalItems} 개</span>
            </div>
            <div className="e-totals__row">
              <span className="e-totals__label">계</span>
              <span>{totalSpent} ⓦ</span>
            </div>
          </div>

          {/* 도장 — 한 번이라도 구매했으면 찍힘 */}
          {totalItems > 0 && (
            <div className="e-stamp">
              <div className="e-stamp__big">확</div>
              <div>인 완 료</div>
            </div>
          )}

          {/* 잉크 자국 */}
          <div className="e-blot" style={{ top: 90, right: 70, width: 14, height: 14 }} />
          <div className="e-blot" style={{ top: 280, left: 90, width: 8, height: 8 }} />
          <div className="e-blot" style={{ bottom: 80, right: 180, width: 10, height: 10, opacity: 0.6 }} />

          {/* 좌측 마진 메모 */}
          <div className="e-margin-memo">{months[today.getMonth()]}月</div>
        </div>

        {/* 쥔장 한마디 */}
        {msg && (
          <div className={`e-msg ${msg.warn ? 'is-warn' : ''}`}>{msg.text}</div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<ShopELedger />);
</script>
</body>
</html>
